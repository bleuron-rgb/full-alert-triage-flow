name: Triage auto-merge

# The alert-triage routine opens pull requests from claude/fix-sentry-* branches
# and labels one `auto-triage` when it believes the fix is small and verified.
# This workflow is the reviewer for those: it re-checks the claims against the
# actual diff and merges only when every gate holds. A PR without the label, or
# one that fails a gate, is left open for a person.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, edited]
    branches: [main]

# Opening and labelling a pull request fire this workflow within a second of each
# other. Without a concurrency group the two runs execute in parallel, both check
# for an existing refusal comment before either has posted one, and both comment.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The repository default is read-only; this job needs to merge and label.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Runs for every PR so the check reports a result. Human PRs pass straight
      # through, which keeps branch protection from blocking a manual merge.
      - name: Decide whether this PR is on the automatic path
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ "$HEAD_REF" == claude/fix-sentry-* ]] && [[ ",$LABELS," == *",auto-triage,"* ]]; then
            echo "automatic=true" >> "$GITHUB_OUTPUT"
            echo "Automatic path: checking every gate before merging."
          else
            echo "automatic=false" >> "$GITHUB_OUTPUT"
            echo "Not an auto-triage PR; leaving it for human review."
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed paths and size
        if: steps.scope.outputs.automatic == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed files:"
          echo "$files"
          if [ -z "$files" ]; then
            echo "::error::Empty diff."
            exit 1
          fi
          unexpected=$(echo "$files" | grep -vE '^(src|test)/[^/]+\.js$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Only src/*.js and test/*.js may change automatically. Unexpected:"
            echo "$unexpected"
            exit 1
          fi
          if ! echo "$files" | grep -qE '^test/'; then
            echo "::error::No test changed; an automatic fix must ship a regression test."
            exit 1
          fi
          count=$(echo "$files" | wc -l)
          if [ "$count" -gt 3 ]; then
            echo "::error::$count files changed; the automatic limit is 3."
            exit 1
          fi
          lines=$(git diff --numstat "$BASE...$HEAD" | awk '{total += $1 + $2} END {print total + 0}')
          echo "Changed lines: $lines"
          if [ "$lines" -gt 20 ]; then
            echo "::error::$lines changed lines; the automatic limit is 20."
            exit 1
          fi

      - name: Check the triage verdict
        if: steps.scope.outputs.automatic == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --input-type=module -e '
            const body = process.env.PR_BODY ?? "";
            const block = body.match(/<triage-verdict>([\s\S]*?)<\/triage-verdict>/);
            if (!block) {
              console.log("::error::The PR body has no <triage-verdict> block.");
              process.exit(1);
            }
            const fields = Object.fromEntries(
              block[1].trim().split("\n").filter((line) => line.includes(":")).map((line) => {
                const [key, ...rest] = line.split(":");
                return [key.trim(), rest.join(":").trim().replace(/\s+#.*$/, "")];
              }),
            );
            console.log("Verdict:", fields);
            const required = {
              reproduced: "true",
              fix_targets: "root-cause",
              behavior_changed_for_working_inputs: "false",
              guesses_made: "none",
            };
            let ok = true;
            for (const [key, want] of Object.entries(required)) {
              if (fields[key] !== want) {
                console.log(`::error::verdict ${key} is "${fields[key]}", expected "${want}".`);
                ok = false;
              }
            }
            const confidence = Number(fields.confidence);
            if (!(confidence >= 0.85)) {
              console.log(`::error::verdict confidence "${fields.confidence}" is below the 0.85 threshold.`);
              ok = false;
            }
            process.exit(ok ? 0 : 1);
          '

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.automatic == 'true'
        with:
          node-version: 22
          cache: npm

      # The strongest gate: a fix that hides a symptom, or a test written to pass
      # against the broken code, fails here because the new tests must fail
      # against the base commit.
      - name: Confirm the new test fails without the fix
        if: steps.scope.outputs.automatic == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout -f "$BASE"
          git checkout "$HEAD" -- test/
          npm ci
          if npm test; then
            echo "::error::The PR's tests pass without the fix, so they do not reproduce the reported failure."
            exit 1
          fi
          echo "Tests fail without the fix, as expected."

      - name: Run the full suite with the fix
        if: steps.scope.outputs.automatic == 'true'
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git checkout -f "$HEAD"
          npm ci
          npm test

      # Ephemeral staging: start the service the way production starts it and
      # exercise it over real HTTP, so a fix that satisfies the unit tests but
      # breaks the running service is caught before it reaches main.
      - name: Boot the service and run smoke tests
        if: steps.scope.outputs.automatic == 'true'
        run: npm run smoke

      # A fix that causes a new error produces a new Sentry issue, so matching on
      # issue id cannot catch a cascade. Counting recent merges can.
      - name: Check the 24-hour automatic merge cap
        if: steps.scope.outputs.automatic == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh pr list --state merged --label auto-triage --limit 50 \
            --json mergedAt --jq "[.[] | select(.mergedAt > \"$since\")] | length")
          echo "auto-triage pull requests merged since $since: $recent"
          if [ "$recent" -ge 3 ]; then
            echo "::error::$recent automatic merges in the last 24 hours. Pausing automation so a person can look."
            exit 1
          fi

      # Turns on GitHub's auto-merge rather than merging directly, because this
      # job is itself the required check and cannot merge while still running.
      - name: Enable auto-merge
        if: steps.scope.outputs.automatic == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch --auto

      - name: Hand the pull request back to a person
        if: failure() && steps.scope.outputs.automatic == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          gh pr edit "$PR" --remove-label auto-triage --add-label needs-human
          # Opening, labelling and pushing all fire this workflow, so comment only once.
          existing=$(gh pr view "$PR" --json comments \
            --jq '[.comments[] | select(.body | startswith("The automatic merge gate refused"))] | length')
          if [ "$existing" -eq 0 ]; then
            gh pr comment "$PR" \
              --body "The automatic merge gate refused this pull request, so it stays open for review. Failed run: $RUN_URL"
          else
            echo "A refusal comment is already on this pull request; not adding another."
          fi

  # Deploys the pull request to the staging app and exercises it there. Kept as a
  # separate job with its own concurrency group: two pull requests share one
  # staging app, so deploys must queue rather than overwrite each other. It does
  # not depend on `gate`, so this check always reports a result instead of sitting
  # skipped and blocking the merge.
  staging:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-staging-deploy
      cancel-in-progress: false
    steps:
      - name: Decide whether this PR is on the automatic path
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ "$HEAD_REF" == claude/fix-sentry-* ]] && [[ ",$LABELS," == *",auto-triage,"* ]]; then
            echo "automatic=true" >> "$GITHUB_OUTPUT"
            echo "Automatic path: deploying this pull request to staging."
          else
            echo "automatic=false" >> "$GITHUB_OUTPUT"
            echo "Not an auto-triage PR; staging is left alone."
          fi

      - uses: actions/checkout@v4
        if: steps.scope.outputs.automatic == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check the deploy token is present
        if: steps.scope.outputs.automatic == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is not set, so the fix cannot be verified on staging. Refusing rather than merging it unverified."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.scope.outputs.automatic == 'true'

      # --wait-timeout holds until the machine passes the /healthz check, so a
      # deploy that starts but never becomes healthy fails here rather than
      # showing up as a confusing smoke-test timeout.
      - name: Deploy the pull request to staging
        if: steps.scope.outputs.automatic == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          flyctl deploy --config fly.staging.toml --build-arg "SENTRY_RELEASE=$HEAD" --wait-timeout 5m

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.automatic == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Smoke test the deployed service
        if: steps.scope.outputs.automatic == 'true'
        env:
          SMOKE_BASE_URL: https://orders-api-staging.fly.dev
        run: |
          npm ci
          npm run smoke
